[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gex-msgraph"
version = "0.1.0"
description = "Async Python wrapper around Microsoft Graph API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "msal>=1.28",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]
calamine = [
    "python-calamine>=0.2",
    "pandas>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gex_msgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "msal"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
